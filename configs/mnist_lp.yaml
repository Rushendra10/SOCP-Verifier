seed: 0
batch_size: 128
test_batch_size: 512
epochs: 23
lr: 0.001
weight_decay: 0.0001
epsilon_train: 0.3
epsilon_eval: 0.3
alpha_robust: 0.5

model_type: cnn

# Available robust-bound backends:
#   interval : simple forward interval bound surrogate.
#   dual     : CROWN-style backward bound; sign-dependent ReLU line choice.
#   dual_WK  : Wong--Kolter fixed-alpha LP-dual objective J_epsilon.
#   deeppoly
#   ibp
#   crown_IBP
bound_method: dual_WK

# Sparse SOCP/ReLU regularizer.
socp_top_k: 32 #32 --> 0.3 
socp_neighbors: 6 #6 --> 4
socp_correction_scale: 0.025 #0.025 --> 0.05
socp_A_init_std: 0.05 #0.005 --> 0.01
socp_mu_lift: 0.2 #0.2 --> 0.1
socp_mu_psd: 1.0


regularizers: true
# Output relaxation-gap penalty
lambda_reg: 0.005
# Internal ReLU consistency penalty
gamma_reg: 0.40
reg_max_targets: 9

#use GLS smoothing to loosen bounds
use_rgs: true
rgs_sigma: 0.001
rgs_nps: 2

linear_size: 100
n1: 16
n2: 32
checkpoint_dir: checkpoints
checkpoint_dir_gls: checkpoints/GLS
checkpoint_dir_reg: checkpoints/REG
checkpoint_dir_reg_gls: checkpoints/REG/GLS
data_dir: data
